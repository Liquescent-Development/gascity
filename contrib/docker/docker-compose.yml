# Gas City tutorial environment: one container with gc, bd, dolt, tmux, and
# Claude Code. Start it, enter it, and follow /opt/gascity-tutorials.
#
#   cd contrib/docker
#   docker compose up -d --build
#   docker compose exec gascity bash
#
# Authentication (pick one; see README.md "Authentication"):
#   - export ANTHROPIC_API_KEY=sk-ant-... before `docker compose up`, or
#   - Claude subscription (Pro/Max): run `claude` once inside the container
#     and log in interactively; credentials persist in the gc-home volume, or
#   - Claude subscription: `claude setup-token` on your host, then
#     export CLAUDE_CODE_OAUTH_TOKEN=<token> before `docker compose up`.
services:
  gascity:
    build:
      # Repo root: the image compiles gc from source and uses the pinned
      # install scripts under .github/scripts/.
      context: ../..
      dockerfile: contrib/docker/Dockerfile
    image: gascity-tutorial
    container_name: gascity-tutorial
    # Reap orphaned processes (tmux panes, dolt sql-server) cleanly.
    init: true
    stdin_open: true
    tty: true
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
    ports:
      # Supervisor API + dashboard: http://localhost:8372/
      - "127.0.0.1:8372:8372"
    volumes:
      # Whole home persists: cities (with their .beads/dolt data), rig
      # working copies under ~/projects, ~/.gc supervisor state, and Claude
      # credentials all survive container rebuilds.
      - gc-home:/home/gcagent

volumes:
  gc-home:
